[project]
name = "ums"
version = "0.1.0"
description = "Universal Memory System - Persistent memory layer for AI applications"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "aiosqlite>=0.20.0",
    "openai>=1.50.0",
    "httpx>=0.28.0",
    "jinja2>=3.1.0",
    "apscheduler>=3.10.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "asgi-lifespan>=2.1.0",
]

[tool.setuptools.packages.find]
include = ["ums*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
